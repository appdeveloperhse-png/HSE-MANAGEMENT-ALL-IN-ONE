name: Build HSE Management System EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }
          python -m pip install --upgrade pypdf pyinstaller

      - name: Verify PDF reader
        run: python -c "import pypdf; print(pypdf.__version__)"

      - name: Check source
        shell: pwsh
        run: |
          if (!(Test-Path "app/main.py")) {
            throw "app/main.py was not found"
          }
          python -m py_compile app/main.py

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --onefile `
            --windowed `
            --clean `
            --name HSE-Management-System `
            --hidden-import=pypdf `
            --collect-all pypdf `
            app/main.py

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist/HSE-Management-System.exe")) {
            throw "EXE was not created"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Management-System-Windows
          path: dist/HSE-Management-System.exe
          if-no-files-found: error
